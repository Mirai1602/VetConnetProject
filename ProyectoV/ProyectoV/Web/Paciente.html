
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Paciente</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  </head>
<body>

  <div class="contenedor-principal">
    
    <div class="tarjeta-registro">
      
      <div class="avatar-superior">
        <img src="Mascota.jpg" alt="Foto de la mascota" onerror="this.src='https://placehold.co/100/b77eff/ffffff?text=🐾'"/>
      </div>

      <h2>Registro de Paciente</h2>
      
      <form action="guardar_paciente.php" method="post">
        
        <div class="fila-inputs">
          <div class="grupo-input">
            <input type="text" id="nombre_mascota" name="nombre_mascota" placeholder="Nombre mascota" required>
          </div>
          <div class="grupo-input">
            <input type="text" id="especie" name="especie" placeholder="Especie (Ej. Perro)" required>
          </div>
        </div>

        <div class="fila-inputs">
          <div class="grupo-input">
            <input type="text" id="raza" name="raza" placeholder="Raza" required>
          </div>
          <div class="grupo-input">
            <input type="text" id="edad" name="edad" placeholder="Edad (Ej. 2 años)" required>
          </div>
        </div>

        <div class="grupo-input">
          <input type="text" id="nombre_dueno" name="nombre_dueno" placeholder="Nombre del Dueño" required>
        </div>

        <div class="grupo-input">
          <input type="tel" id="telefono_contacto" name="telefono_contacto" placeholder="Teléfono de contacto" required>
        </div>


           <button type="button" class="btn-guardar" onclick="location.href='citasP.html'">GuardarPaciente</button>
      </form>

      <div class="acciones-paciente">
        <button type="button" class="btn-secundario">Ver historial</button>
        <button type="button" class="btn-secundario">Nueva consulta</button>
        <button type="button" class="btn-secundario">Volver</button>
      </div>

    </div>
  </div>

</body>
<style>
 
    :root {
      --amarillo-pastel: #fdf6b7; /* Fondo suave de tu paleta */
      --morado-principal: #b77eff; /* El violeta/morado para el botón de acción */
      --naranja-acento: #ffc247;    /* El naranja para detalles y focos */
      --blanco: #ffffff;
      --texto-oscuro: #2c2c2c;
      --texto-suave: #8a8a8a;
    }

   
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Outfit', sans-serif;
    }

    body {
        background-color: var(--amarillo-pastel); 
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .contenedor-principal {
        width: 100%;
        max-width: 450px;
    }

   
    .tarjeta-registro {
        background-color: var(--blanco);
        border-radius: 35px;
        padding: 40px 30px 30px 30px;
        box-shadow: 0 15px 35px rgba(183, 126, 255, 0.1); /* Sombra con un sutil toque morado */
        position: relative;
        text-align: center;
        margin-top: 50px;
    }

    /* (Para la foto de la mascota) */
    .avatar-superior {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: absolute;
        top: -50px;
        left: calc(50% - 50px);
        box-shadow: 0 8px 20px rgba(183, 126, 255, 0.2);
        overflow: hidden;
        border: 5px solid var(--blanco);
        background-color: #f5f5f5;
    }

    .avatar-superior img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .tarjeta-registro h2 {
        color: var(--texto-oscuro); 
        font-size: 26px;
        font-weight: 600;
        margin-top: 25px;
        margin-bottom: 30px;
    }

   
    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .fila-inputs {
        display: flex;
        gap: 15px;
    }

    .fila-inputs .grupo-input {
        flex: 1;
    }

    .grupo-input input, .grupo-input select {
        width: 100%;
        padding: 15px 20px;
        background-color: rgba(253, 246, 183, 0.15); /* Fondo con un toque sutil amarillo */
        border: 1px solid rgba(183, 126, 255, 0.2); /* Borde morado muy suave */
        border-radius: 20px;
        font-size: 15px;
        color: var(--texto-oscuro);
        outline: none;
        transition: all 0.3s ease;
        appearance: none; /* Quita el diseño por defecto en selectores si los usas */
    }

    /* Efecto focus: El borde se ilumina en naranja de acento */
    .grupo-input input:focus, .grupo-input select:focus {
        border-color: var(--naranja-acento);
        box-shadow: 0 0 8px rgba(255, 194, 71, 0.3);
    }

    .grupo-input input::placeholder {
        color: var(--texto-suave);
        font-weight: 400;
    }

    
    /* Botón Principal (Guardar Paciente): Morado Vibrante */
    .btn-guardar {
        background-color: var(--morado-principal);
        color: white;
        border: none;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 25px;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.2s ease;
    }

    .btn-guardar:hover {
        background-color: #a261f2; /* Un morado un toque más oscuro en hover */
        box-shadow: 0 5px 15px rgba(183, 126, 255, 0.4);
    }

    .btn-guardar:active {
        transform: scale(0.98);
    }

    /* Sección de acciones secundarias abajo */
    .acciones-paciente {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid rgba(183, 126, 255, 0.15);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    /* Botones Secundarios en Naranja */
    .btn-secundario {
        background: none;
        border: 1px solid var(--naranja-acento);
        color: #e09916; /* Un tono naranja más oscuro para que sea legible el texto */
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-secundario:hover {
        background-color: var(--naranja-acento);
        color: white;
    }

    /* Detalle decorativo final en naranja */
    .acciones-paciente:after {
        content: '';
        display: block;
        width: 40px;
        height: 2px;
        background-color: var(--naranja-acento);
        margin-top: 20px;
        border-radius: 1px;
    }
  </style>
</html>
