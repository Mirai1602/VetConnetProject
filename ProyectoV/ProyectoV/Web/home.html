<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <title>VetConnect - Selección de Perfil</title>
</head>
<body>

    <div class="MensajeBienvenida">
        <h3>Bienvenido a VetConnect, tu plataforma de gestión veterinaria.</h3>
    </div> 

    <main class="container" id="perfiles">
        <section class="cards">
            
            <!-- TARJETA: VETERINARIO -->
            <article class="card">
                <h2>Veterinario</h2>
                <div class="card-img-container">
                    <img src="Veterinario.jpg" alt="Veterinario">
                </div>
                <p class="card-text">Accede al perfil de veterinarios.</p>
                <button class="btn-opcion" onclick="location.href='veterinario.html'">Veterinario</button>
            </article>

            <!-- TARJETA: PACIENTES (image_6386ad.png) -->
            <article class="card">
                <h2>Pacientes</h2>
                <div class="card-img-container">
                    <img src="Pacientes.jpg" alt="Pacientes">
                </div>
                <p class="card-text">Accede al perfil de pacientes.</p>
                <!-- Corrección de enlace para que apunte exactamente al archivo de Registro (image_63872a.png) -->
             <button class="btn-opcion" onclick="location.href='paciente.html'">Paciente</button>
            </article>

        </section>
    </main>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            padding: 60px 20px;
            background-color: #ffffff;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .MensajeBienvenida h3 {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 24px;
            text-align: center;
            margin-bottom: 50px;
            color: #444;
        }

        .cards {
            display: flex;
            flex-direction: row;      
            justify-content: center;   
            align-items: center;
            gap: 40px;                 
            width: 100%;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 24px;
            width: 300px;              
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card h2 {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #222;
            margin-bottom: 16px;
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .card p {
            font-family: 'Nunito', sans-serif; 
            font-weight: 600;   
            font-size: 14px;   
            color: #777;
            margin-bottom: 24px;
            min-height: 20px;
        }

        .card button {
            background: #2720FF;
            color: #ffffff;
            border: none;
            padding: 12px 28px; 
            border-radius: 50px;      
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 16px;
            transition: background 0.2s ease, transform 0.1s ease;
            width: 90%;
            outline: none;
        }

        .card button:hover {
            background: #1c17c7;
        }
        
        .card button:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            .cards {
                flex-direction: column;
                gap: 30px;
            }
        }
    </style>

</body>
</html>
