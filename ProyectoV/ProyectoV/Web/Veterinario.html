<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Veterinario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="contenedor-principal">
    
    <div class="tarjeta-registro">
      
      <div class="avatar-superior">
       
      </div>

      <h2>Registro de Veterinario</h2>
      
      <form action="guardar_veterinario.php" method="post">
        
        <div class="fila-inputs">
          <div class="grupo-input">
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
          </div>
          <div class="grupo-input">
            <input type="text" id="apellido" name="apellido" placeholder="Apellido" required>
          </div>
        </div>

        <div class="grupo-input">
          <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required>
        </div>

        <div class="grupo-input">
          <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
        </div>

        <div class="grupo-input">
          <input type="text" id="especialidad" name="especialidad" placeholder="Especialidad (Ej. Cardiología)">
        </div>

        <div class="grupo-input">
          <input type="text" id="rol" name="rol" value="Veterinario" readonly class="input-readonly">
        </div>

        <button type="submit" class="btn-guardar">Guardar Perfil</button>
      </form>

      <div class="acciones-veterinario">
        <button type="button" class="btn-secundario">Ver citas</button>
        <button type="button" class="btn-secundario">Registrar paciente</button>
        <button type="button" class="btn-secundario">Editar perfil</button>
      </div>

    </div>
  </div>

 <style>

    :root {
      --azul-oscuro: #1d26f3; /* El azul vibrante y oscuro de la imagen */
      --azul-medio: #6e84ff;  /* El azul medio */
      --celeste: #a3f4ff;      /* El celeste muy claro */
      --blanco: #ffffff;
      --magenta: #f6b366;      /* El rosa/magenta para acentos */
      --texto-oscuro: #111111; /* Para texto principal si el azul es muy claro */
      --texto-suave: #6e6e6e;  /* Gris suave para placeholder */
    }

  
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Outfit', sans-serif;
    }

    body {
      
        background-color: var(--celeste); 
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .contenedor-principal {
        width: 100%;
        max-width: 450px;
    }

    .tarjeta-registro {
        background-color: var(--blanco);
        border-radius: 35px;
        padding: 40px 30px 30px 30px;
        box-shadow: 0 15px 35px rgba(29, 38, 243, 0.1); /* Sombra con toque azul */
        position: relative;
        text-align: center;
        margin-top: 50px;
    }

    /* AVATAR CIRCULAR SUPERIOR */
    .avatar-superior {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: absolute;
        top: -50px;
        left: calc(50% - 50px);
        box-shadow: 0 8px 20px rgba(29, 38, 243, 0.2); /* Sombra con toque azul */
        overflow: hidden;
        border: 5px solid var(--blanco);
    }

    .avatar-superior img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* TÍTULO H2 */
    .tarjeta-registro h2 {
        /* Usamos el azul oscuro para el título principal */
        color: var(--azul-oscuro); 
        font-size: 26px;
        font-weight: 500;
        margin-top: 25px;
        margin-bottom: 30px;
    }

  
    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .fila-inputs {
        display: flex;
        gap: 15px;
    }

    .fila-inputs .grupo-input {
        flex: 1;
    }

    .grupo-input input {
        width: 100%;
        padding: 15px 20px;
        /* Fondo de los inputs: Celeste muy suave para texturizar */
        background-color: rgba(163, 244, 255, 0.1); 
        border: 1px solid rgba(110, 132, 255, 0.2); /* Borde azul medio muy suave */
        border-radius: 20px;
        font-size: 15px;
        color: var(--texto-oscuro);
        outline: none;
        transition: all 0.3s ease;
    }

    
    .grupo-input input:focus {
        border-color: var(--azul-medio);
        box-shadow: 0 0 8px rgba(110, 132, 255, 0.2);
    }

    .grupo-input input::placeholder {
        color: var(--texto-suave);
        font-weight: 400;
    }

    /* Input de rol (solo lectura) */
    .grupo-input input.input-readonly {
        background-color: #f5f5f5;
        color: #7a828a;
        cursor: not-allowed;
        border-color: #e0e0e0;
    }

 
    /* Botón Principal (Guardar Perfil): Azul Oscuro y Vibrante */
    .btn-guardar {
        background-color: var(--azul-oscuro);
        color: white;
        border: none;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 25px;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-guardar:hover {
        background-color: var(--azul-medio); /* Cambia a azul medio en hover */
        box-shadow: 0 5px 15px rgba(29, 38, 243, 0.3);
    }

    .btn-guardar:active {
        transform: scale(0.98);
    }

    /* Sección de acciones secundarias abajo */
    .acciones-veterinario {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid rgba(110, 132, 255, 0.1); /* Línea divisoria azul muy sutil */
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    /* Botones Secundarios: Usamos el azul medio para el borde y texto */
    .btn-secundario {
        background: none;
        border: 1px solid var(--azul-medio);
        color: var(--azul-medio);
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-secundario:hover {
        background-color: var(--azul-medio);
        color: white;
    }

    /* Acento de Magenta: Un sutil detalle al final */
    .acciones-veterinario:after {
        content: '';
        display: block;
        width: 40px;
        height: 2px;
        background-color: var(--magenta); /* Acento magenta al final */
        margin-top: 20px;
        border-radius: 1px;
    }

  </style>

</body>
</html>
